server {
    listen 80 default_server;
    server_name strimo.com;

    location /api/ {
        proxy_pass http://172.18.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_header Authorization;
    }

    location /videos/ {
        internal;

        proxy_pass http://rustfs:9000;

        proxy_http_version 1.1;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_set_header Host rustfs:9000;

        proxy_hide_header Access-Control-Allow-Methods;

        add_header 'Access-Control-Allow-Methods' 'GET' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
    }
}
