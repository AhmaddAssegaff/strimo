info:
  title: Backend docs
  description: docs POS
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: Authorization
      in: header
    refresh-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: Authorization
      in: header
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: User email
          example: Ahmad@gmail.com
        password:
          type: string
          description: User password
          example: Ahmad123
      required:
        - email
        - password
    registerDto:
      type: object
      properties:
        email:
          type: string
          description: User email
          example: Ahmad@gmail.com
        password:
          type: string
          description: User password
          example: Ahmad123
        username:
          type: string
          description: username user
          example: Ahmad assegaff
        phone_number:
          type: string
          description: phone number user
          example: "+6281234567890"
      required:
        - email
        - password
        - username
        - phone_number
    VerifyAccountConfirmDto:
      type: object
      properties:
        token:
          type: string
          description: User OTP
          example: "572769"
      required:
        - token
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          description: User email
          example: Ahmad@gmail.com
        password:
          type: string
          description: User password
          example: Ahmad123
        username:
          type: string
          description: username user
          example: Ahmad assegaff
      required:
        - email
        - password
        - username
    UpdateStatusUserDto:
      type: object
      properties:
        status:
          type: string
          description: New User status
          enum:
            - active
            - deactive
          example: deactive
      required:
        - status
