services:
  postgres:
    image: postgres:16
    container_name: postgres-strimo
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-strimo
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '${PGADMIN_PORT}:80'
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: redis-strimo
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11
    container_name: rustfs-strimo
    ports:
      - '${RUSTFS_API_PORT}:9000'
      - '${RUSTFS_DASHBOARD_CONSOLE_PORT}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-strimo
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../etc/nginx/certs:/etc/nginx/certs:ro
      - ../etc/nginx/www:/var/www/certbot:ro

  nestjs-app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    container_name: nestjs-strimo
    ports:
      - '${APP_PORT}:3000'
    env_file:
      - ../.env
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
